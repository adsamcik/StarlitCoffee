name: Code quality

on:
  pull_request:
    paths:
      - '.github/workflows/code-quality.yml'
      - '.editorconfig'
      - 'app/**'
      - 'build.gradle.kts'
      - 'config/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/code-quality.yml'
      - '.editorconfig'
      - 'app/**'
      - 'build.gradle.kts'
      - 'config/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run static analysis, tests, and debug build
        env:
          GITHUB_TOKEN: ${{ secrets.MINDLAYER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:detekt :app:lintDebug testDebugUnitTest :app:assembleDebug \
            --no-daemon --stacktrace
