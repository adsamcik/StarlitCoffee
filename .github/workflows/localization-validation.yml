name: Localization validation

on:
  pull_request:
    paths:
      - '.github/workflows/localization-validation.yml'
      - 'app/src/main/assets/p1_exact_*.json'
      - 'app/src/main/java/com/adsamcik/starlitcoffee/ui/guidance/**'
      - 'app/src/main/res/raw*/p1_exact_*.json'
      - 'app/src/main/res/raw*/pulsar_learn_guidance.json'
      - 'app/src/main/res/xml/locales_config.xml'
      - 'app/src/test/java/com/adsamcik/starlitcoffee/ui/guidance/**'
      - 'docs/brewing/p1-exact-*'
      - 'docs/brewing/research/terminology-2026-08-06/**'
      - 'tools/*p1_exact*'
      - 'tools/*pulsar_learn_guidance*'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/localization-validation.yml'
      - 'app/src/main/assets/p1_exact_*.json'
      - 'app/src/main/java/com/adsamcik/starlitcoffee/ui/guidance/**'
      - 'app/src/main/res/raw*/p1_exact_*.json'
      - 'app/src/main/res/raw*/pulsar_learn_guidance.json'
      - 'app/src/main/res/xml/locales_config.xml'
      - 'app/src/test/java/com/adsamcik/starlitcoffee/ui/guidance/**'
      - 'docs/brewing/p1-exact-*'
      - 'docs/brewing/research/terminology-2026-08-06/**'
      - 'tools/*p1_exact*'
      - 'tools/*pulsar_learn_guidance*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate generated localization artifacts
        run: |
          python tools/generate_p1_exact_terminology_references.py --check
          python tools/validate_p1_exact_terminology_catalog.py
          python tools/audit_p1_exact_terminology_prose.py --check
          python tools/generate_p1_exact_terminology_review_packets.py --check
          python tools/generate_p1_exact_terminology_locale_queue.py --check
          python tools/generate_p1_tracker_accepted_asset_catalog.py --check
          python tools/generate_p1_exact_guidance_localizations.py --check
          python tools/generate_pulsar_learn_guidance_localizations.py --check

      - name: Run localization unit tests
        run: |
          python -m unittest \
            tools/test_generate_p1_exact_guidance_localizations.py \
            tools/test_generate_p1_exact_guidance_offline_drafts.py \
            tools/test_audit_p1_exact_terminology_prose.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.MINDLAYER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
